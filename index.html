<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рейс</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: фиксированная боковая навигация + рабочая область; один яркий акцент — «посадочный талон» */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f5f7fb; --line:#dde2ec;
  --fg:#141a2a; --muted:#5b6479; --faint:#8a93a8;
  --amber:#e4852a; --amber-ink:#b45d16; --amber-soft:#fcecd9;
  --sea:#12988a; --sea-ink:#0b7266; --sea-soft:#d8f1ed;
  --coral:#e0584a; --coral-soft:#fbe3df;
  --indigo:#5b62c9; --gold:#c39a1f; --slate:#7c879e;
  --ticket:linear-gradient(118deg,#18194a 0%,#33337a 38%,#8e4b86 68%,#ee8a3a 100%);
  --ticket-fg:#fff8ef;
  --shadow:0 1px 2px rgba(20,26,42,.06),0 8px 24px rgba(20,26,42,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter Tight","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#161f32; --surface-2:#1c2740; --line:#2a3550;
  --fg:#e8ecf5; --muted:#a0a9bf; --faint:#76809a;
  --amber:#f0a33c; --amber-ink:#f5b45c; --amber-soft:#3a2a17;
  --sea:#35c2ac; --sea-ink:#4fd3bd; --sea-soft:#14332f;
  --coral:#ff7a6b; --coral-soft:#3b1f1d;
  --indigo:#8b91f0; --gold:#e1bd4a; --slate:#9aa4bb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#161f32; --surface-2:#1c2740; --line:#2a3550;
  --fg:#e8ecf5; --muted:#a0a9bf; --faint:#76809a;
  --amber:#f0a33c; --amber-ink:#f5b45c; --amber-soft:#3a2a17;
  --sea:#35c2ac; --sea-ink:#4fd3bd; --sea-soft:#14332f;
  --coral:#ff7a6b; --coral-soft:#3b1f1d;
  --indigo:#8b91f0; --gold:#e1bd4a; --slate:#9aa4bb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,34px);font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--sea-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:20px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;padding-left:6px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ticket);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark svg{width:17px;height:17px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--amber-soft);color:var(--amber-ink);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.side-foot label{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.view{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px}
@media (min-width:900px){.view{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.scrim{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s ease;
    padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(22px,env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{font-size:19px;padding:0}
  .view{padding-top:20px}
}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:9px 14px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1206}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#04201c}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--coral);border-color:var(--coral-soft)}
.btn.danger.armed{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;font-size:14.5px}
.input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
textarea.input{resize:vertical;min-height:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:6px;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.soon{background:var(--amber-soft);color:var(--amber-ink)}
.pill.now{background:var(--sea-soft);color:var(--sea-ink)}
.pill.past{background:var(--surface-2);color:var(--faint)}
.pill.draft{background:var(--surface-2);color:var(--muted)}
.iso{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-family:var(--f-body)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted);font-size:13.5px}
.note b{color:var(--fg)}
.note.warn{background:var(--coral-soft);color:var(--fg)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty p{color:var(--muted);max-width:56ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--fg);text-align:left}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---- trip picker ---- */
.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.picker select{max-width:100%;flex:1 1 220px}

/* ---- boarding pass ---- */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 210px;background:var(--ticket);color:var(--ticket-fg);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 18px 40px -18px rgba(40,30,90,.55)}
.ticket::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 100%,rgba(255,190,110,.28),transparent 55%);pointer-events:none}
.t-main{padding:24px 26px;display:flex;flex-direction:column;gap:18px;min-width:0;position:relative;z-index:1}
.t-top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:600}
.t-route{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.t-code{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6vw,54px);line-height:.9;letter-spacing:.01em}
.t-city{font-size:13px;opacity:.85;margin-top:6px}
.t-plane{flex:1 1 60px;min-width:50px;display:flex;align-items:center;gap:6px;opacity:.75}
.t-plane i{flex:1;border-top:2px dotted currentColor}
.t-plane svg{width:22px;height:22px;fill:currentColor}
.t-fields{display:grid;grid-template-columns:repeat(4,minmax(0,auto));gap:10px 24px;justify-content:start}
.t-fields div{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-fields span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:600}
.t-fields b{font-weight:600;font-size:15px}
.t-stub{position:relative;z-index:1;border-left:2px dashed rgba(255,248,239,.4);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:rgba(10,10,40,.18)}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.t-stub::before{top:-12px}.t-stub::after{bottom:-12px}
.t-count{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;color:#ffd7a8}
.t-count small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ticket-fg);opacity:.85;margin-top:8px;line-height:1.3}
.t-barcode{height:34px;background:repeating-linear-gradient(90deg,rgba(255,248,239,.85) 0 2px,transparent 2px 4px,rgba(255,248,239,.85) 4px 5px,transparent 5px 8px,rgba(255,248,239,.85) 8px 11px,transparent 11px 13px);border-radius:2px;opacity:.7}
.ticket .btn{background:rgba(255,248,239,.14);border-color:rgba(255,248,239,.3);color:var(--ticket-fg)}
.ticket .btn:hover{background:rgba(255,248,239,.24)}
@media (max-width:640px){
  .ticket{grid-template-columns:minmax(0,1fr)}
  .t-main{padding:20px}
  .t-stub{border-left:0;border-top:2px dashed rgba(255,248,239,.4);flex-direction:row;align-items:center;padding:18px 20px}
  .t-stub::before{top:-13px;left:-12px}.t-stub::after{top:-13px;bottom:auto;left:auto;right:-12px}
  .t-count{font-size:48px}
  .t-barcode{width:90px;flex:none}
  .t-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---- overview ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{padding:16px 18px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:4px;line-height:1.15;overflow-wrap:anywhere}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;text-align:left}
.qa:hover{border-color:var(--amber)}
.qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber-ink)}
.qa .ic.s{background:var(--sea-soft);color:var(--sea-ink)}
.qa svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qa b{font-weight:600}
.qa small{color:var(--muted);font-size:12.5px;line-height:1.35}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .emo{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}.stat b{font-size:24px}}

/* ---- trips ---- */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.trip{display:flex;flex-direction:column;overflow:hidden;padding:0}
.trip.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.banner{height:92px;background:var(--ticket);position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;color:var(--ticket-fg)}
.banner .emo{font-size:34px;line-height:1}
.banner .iso{background:rgba(255,248,239,.16);border-color:rgba(255,248,239,.3);color:var(--ticket-fg)}
.trip-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.trip-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* ---- destinations ---- */
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dest{display:flex;flex-direction:column;gap:12px}
.dest-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dest-top h3{font-size:18px}
.temp{text-align:right;flex:none}
.temp b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1}
.temp span{display:block;font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.dest p{font-size:13.5px;color:var(--muted)}
.dest .row{margin-top:auto}

/* ---- budget ---- */
.bud{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.bud-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.money{position:relative}
.money .input{padding-right:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.money em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--faint);font-size:13px;pointer-events:none}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.total{font-family:var(--f-display);font-size:clamp(30px,4vw,40px);font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.derived{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.derived div{padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm);min-width:0}
.derived span{font-size:11.5px;color:var(--muted);display:block}
.derived b{font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%;transition:width .25s}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend div{display:grid;grid-template-columns:auto 1fr auto 46px;gap:10px;align-items:center}
.legend .pct{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend .amt{font-variant-numeric:tabular-nums;font-weight:500}
@media (max-width:860px){.bud{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.bud-inputs{grid-template-columns:minmax(0,1fr)}.derived{grid-template-columns:minmax(0,1fr)}}

/* ---- route ---- */
.days{display:flex;flex-direction:column;gap:14px}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px}
.day-n{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.day-n b{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1}
.day-n span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:center}
.day .card{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.day-title{font-weight:600;font-size:15.5px;border:0;border-bottom:1px dashed transparent;background:transparent;padding:2px 0;width:100%;min-width:0;border-radius:0}
.day-title:focus{outline:none;border-bottom-color:var(--amber)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.items li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--surface-2);font-size:14px}
.items li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sea);flex:none}
.items li span{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{color:var(--coral);background:var(--coral-soft)}
.add-row{display:flex;gap:8px}
.add-row .input{flex:1}
@media (max-width:520px){.day{grid-template-columns:minmax(0,1fr)}.day-n{flex-direction:row;gap:8px;align-items:baseline;padding:0}}

/* ---- search ---- */
.sfields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.sfields .w2{grid-column:span 2}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lgroup{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);text-decoration:none;color:var(--fg);background:var(--surface)}
.lnk:hover{border-color:var(--sea)}
.lnk b{font-weight:600}
.lnk small{display:block;color:var(--muted);font-size:12px}

function plural(n, f){ n = Math.abs(n); const a = n % 100, b = n % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }

function parseD(s){ if(!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function today0(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const diffDays = (a, b) => Math.round((b - a) / 86400000);
function fmtDate(d, year){ return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + (year ? ' ' + d.getFullYear() : ''); }
function fmtRange(t){
  const a = parseD(t.startDate), b = parseD(t.endDate);
  if (!a) return 'Даты не выбраны';
  if (!b) return 'с ' + fmtDate(a, true);
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return a.getDate() + '–' + b.getDate() + ' ' + MONTHS_GEN[a.getMonth()] + ' ' + a.getFullYear();
  return fmtDate(a, a.getFullYear() !== b.getFullYear()) + ' – ' + fmtDate(b, true);
}
function tripDays(t){ const a = parseD(t.startDate), b = parseD(t.endDate); return a && b && b >= a ? diffDays(a, b) + 1 : null; }

}

function normalize(s){
  s.profile = s.profile || {name:''};

  s.trips = s.trips.map(t => { const b = blankTrip(t); b.budget = Object.assign(blankTrip().budget, t.budget || {}); b.itinerary = Array.isArray(t.itinerary) ? t.itinerary : []; b.packing = Array.isArray(t.packing) ? t.packing : []; return b; });

}

route(){

  if (!t) return '<div class="head"><div><h1>Маршрут</h1></div></div>' + needTrip('Маршрут');

    body = '<div class="empty"><h2>План пока пуст</h2><p>'+(days?'В поездке '+days+' '+plural(days,DAYS_F)+'. ':'')+'Добавьте дни вручную или попросите помощника составить черновик — его можно будет отредактировать.</p>' +
      (routeErr ? '<div class="note warn">'+esc(routeErr)+'</div>' : '') +
      '<div class="row"><button class="btn primary" data-act="route-ai"'+(aiState!=='ok'||routeBusy||!t.city?' disabled':'')+'>'+(routeBusy?'<span class="thinking"><i></i><i></i><i></i></span> Составляю план…':ico('ai')+' Сгенерировать с AI')+'</button><button class="btn" data-act="day-add">'+ico('plus')+'Добавить день</button></div>' +
      (aiState==='off'?'<p style="font-size:13px">AI недоступен в этом окне — добавьте дни вручную.</p>':(!t.city?'<p style="font-size:13px">Укажите город поездки, чтобы помощник мог составить план.</p>':'')) + '</div>';
  } else {

      const date = a ? addDays(a, i) : null;
      return '<div class="day"><div class="day-n"><b class="num">'+(i+1)+'</b><span>'+(date ? date.getDate()+' '+MONTHS_SHORT[date.getMonth()] : 'день')+'</span></div>' +
        '<div class="card"><div class="row" style="flex-wrap:nowrap"><input class="day-title" id="day-title-'+i+'" data-day="'+i+'" value="'+esc(d.title)+'" placeholder="Заголовок дня" aria-label="Заголовок дня '+(i+1)+'"><button class="x" data-act="day-del" data-i="'+i+'" aria-label="Удалить день">×</button></div>' +
        '<ul class="items">' + d.items.map((it, j) => '<li><span>'+esc(it)+'</span><button class="x" data-act="item-del" data-i="'+i+'" data-j="'+j+'" aria-label="Удалить пункт">×</button></li>').join('') + '</ul>' +

    }).join('') + '</div><div class="row"><button class="btn" data-act="day-add">'+ico('plus')+'Добавить день</button>'+(days && t.itinerary.length < days ? '<span class="muted" style="font-size:13px">Запланировано '+t.itinerary.length+' из '+days+' '+plural(days,DAYS_F)+'</span>':'')+'</div>';

/* ---- Список вещей ---- */
packing(){

  if (!t) return '<div class="head"><div><h1>Список вещей</h1></div></div>' + needTrip('Список вещей');
  const total = t.packing.length, done = t.packing.filter(p => p.done).length;

   (done ? '<button class="btn sm ghost" data-act="pack-clear">Убрать собранное</button>' : '') + '</div>' +

},

/* ---- Погода ---- */
weather(){
  const m = curMonth(), d = DESTINATIONS[wxIndex];
  const lo = Math.min.apply(null, d.night) - 3, hi = Math.max.apply(null, d.day) + 4, span = hi - lo;
  const y = v => (v - lo) / span * 100;
  const zero = lo < 0 && hi > 0 ? '<div class="zero" style="bottom:'+y(0)+'%"><span>0°</span></div>' : '';
  const cols = d.day.map((dv, i) => { const nv = d.night[i];
    return '<div class="col'+(i===m?' cur':'')+'"><div class="bar" style="bottom:'+y(nv)+'%;height:'+(y(dv)-y(nv))+'%"></div>' +
      '<div class="lbl" style="bottom:calc('+y(dv)+'% + 4px)">'+fmtT(dv)+'</div><div class="lbl lo" style="bottom:calc('+y(nv)+'% - 18px)">'+fmtT(nv)+'</div></div>'; }).join('');
  return '<div class="head"><div><h1>Погода</h1><p>Климатическая норма — средние дневные и ночные температуры по месяцам. Это не прогноз.</p></div></div>' +
   '<div class="wx"><section class="card"><div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="iso">'+d.iso+'</span><h2>'+d.city+', '+d.country+'</h2></div><span class="muted" style="font-size:12.5px">день / ночь, °C</span></div>' +
   '<div class="chart-wrap"><div class="chart-inner"><div class="chart" role="img" aria-label="Средние температуры по месяцам в '+d.city+'">'+zero+cols+'</div>' +
   '<div class="months">'+MONTHS_SHORT.map((x, i) => '<span class="'+(i===m?'cur':'')+'">'+x+'</span>').join('')+'</div></div></div></section>' +
   '<aside class="card wx-side"><div><span class="eyebrow">Сейчас в среднем · '+MONTHS[m]+'</span><div class="now-t num">'+fmtT(d.day[m])+' <small>/ '+fmtT(d.night[m])+'</small></div></div>' +
   '<dl class="facts"><dt>Лучший сезон</dt><dd>'+d.season+'</dd><dt>Виза</dt><dd>'+d.visa+'</dd></dl><p class="muted" style="font-size:13.5px">'+d.desc+'</p>' +
   '<div class="note"><div>Точный прогноз на ваши даты смотрите в сервисах погоды, например <a href="https://www.gismeteo.ru/search/'+encodeURIComponent(d.city)+'/" target="_blank" rel="noopener noreferrer">Gismeteo</a> или <a href="https://yandex.ru/pogoda/search?request='+encodeURIComponent(d.city)+'" target="_blank" rel="noopener noreferrer">Яндекс Погоду</a>.</div></div>' +
   '<button class="btn sm primary" data-act="dest-trip" data-i="'+wxIndex+'">Запланировать поездку</button></aside></div>' +
   '<section><div class="head" style="margin-bottom:12px"><h2>Все направления в '+MONTHS_PREP[m]+'</h2></div><div class="wx-grid">' +
   DESTINATIONS.map((x, i) => '<button class="wx-cell'+(i===wxIndex?' on':'')+'" data-act="wx-pick" data-i="'+i+'"><span><b>'+x.city+'</b><small>'+x.country+'</small></span><span class="t">'+fmtT(x.day[m])+'</span></button>').join('') + '</div></section>';
}
};
function fmtT(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '°'; }

/* ---- бюджет: живое обновление без перерисовки полей ---- */
function updateBudget(){
  const t = activeTrip(); if (!t || route !== 'budget') return;
  const tot = budTotal(t), n = Math.max(1, t.travelers || 1), d = tripDays(t);
  $('#bud-total').textContent = money(tot, t.currency);
  $('#bud-pp').textContent = money(tot / n, t.currency);
  $('#bud-pd').textContent = d ? money(tot / d, t.currency) : 'укажите даты';
  $('#bud-ppd').textContent = d ? money(tot / n / d, t.currency) : '—';
  $('#bud-reserve').textContent = money(tot * .1, t.currency) + ' – ' + money(tot * .15, t.currency);
  $('#bud-stack').innerHTML = tot ? CATS.map(c => { const v = Number(t.budget[c.k]) || 0; return v ? '<i style="width:'+(v/tot*100)+'%;background:'+c.c+'" title="'+c.n+'"></i>' : ''; }).join('') : '';
  $('#bud-legend').innerHTML = CATS.map(c => { const v = Number(t.budget[c.k]) || 0;
    return '<div><i class="dot" style="background:'+c.c+'"></i><span>'+c.n+'</span><span class="amt">'+money(v, t.currency)+'</span><span class="pct">'+(tot?Math.round(v/tot*100):0)+'%</span></div>'; }).join('');
}

/* ---- поиск ---- */
let searchFor = null;
function syncSearch(){
  const t = activeTrip();
  if (t && searchFor !== t.id){
    searchFor = t.id; const d = findDest(t);
    search.city = t.city || ''; search.iata = d ? d.iata : ''; search.start = t.startDate || ''; search.end = t.endDate || ''; search.guests = t.travelers || 1;
  }
}
function links(){
  const s = search, city = encodeURIComponent(s.city || ''), n = Math.max(1, +s.guests || 1);
  const a = parseD(s.start), b = parseD(s.end), from = (s.from || 'ALA').toUpperCase(), to = (s.iata || '').toUpperCase();
  const yymmdd = d => String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const ddmm = d => String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0');
  const dmy = d => String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  const gq = 'Flights from ' + from + ' to ' + (to || s.city || '') + (a ? ' on ' + s.start : '') + (b ? ' through ' + s.end : '');
  const datesQ = (a ? '&checkin=' + s.start : '') + (b ? '&checkout=' + s.end : '');
  const fl = [
    {n:'Google Flights', d:from + ' → ' + (to || s.city || 'куда угодно'), u:'https://www.google.com/travel/flights?hl=ru&q=' + encodeURIComponent(gq)},
    {n:'Skyscanner', d:to ? 'Туда-обратно, ' + n + ' ' + plural(n, PEOPLE_F) : 'Укажите аэропорт назначения', u: to ? 'https://www.skyscanner.ru/transport/flights/' + from.toLowerCase() + '/' + to.toLowerCase() + '/' + (a ? yymmdd(a) + '/' : '') + (a && b ? yymmdd(b) + '/' : '') + '?adultsv2=' + n : 'https://www.skyscanner.ru/'},
    {n:'Aviasales', d:to && a ? 'С датами и пассажирами' : 'Укажите аэропорт и даты', u: to && a ? 'https://www.aviasales.ru/search/' + from + ddmm(a) + to + (b ? ddmm(b) : '') + n : 'https://www.aviasales.ru/'}
  ];
  const st = [
    {n:'Booking.com', d:(s.city || 'Город не указан') + (a ? ', ' + fmtDate(a) : ''), u:'https://www.booking.com/searchresults.ru.html?ss=' + city + datesQ + '&group_adults=' + n + '&no_rooms=1'},
    {n:'Airbnb', d:'Квартиры и дома', u:'https://www.airbnb.ru/s/' + (city || 'homes') + '/homes?adults=' + n + datesQ},
    {n:'Островок', d:'Отели и апартаменты', u:'https://ostrovok.ru/hotel/search/?q=' + city + (a && b ? '&dates=' + dmy(a) + '-' + dmy(b) : '') + '&guests=' + n}
  ];
  const ex = [
    {n:'GetYourGuide', d:'Экскурсии и билеты в музеи', u:'https://www.getyourguide.ru/s/?q=' + city + (a ? '&date_from=' + s.start : '') + (b ? '&date_to=' + s.end : '')}
  ];
  return {fl, st, ex};
}

/* ================= AI ================= */

 'Помогаешь: подобрать направление, составить маршрут по дням, оценить бюджет, выбрать сезон с учётом погоды, собрать список вещей, дать советы по жилью и перелётам.\n' +
 'Пользователь по умолчанию живёт в Казахстане (вылет обычно из Алматы или Астаны) — учитывай это в визовых и логистических советах, но напоминай проверять правила въезда перед поездкой.\n' +
 'Не выдумывай точные цены, расписания рейсов и номера рейсов: давай ориентировочные диапазоны и советуй проверить на сайтах. Если чего-то не знаешь — так и скажи.\n' +
 'Пиши коротко и по делу: короткие абзацы, списки через «- », заголовки через «### » только если нужно. Без лишних вступлений.';
function tripsContext(){
  if (!state.trips.length) return 'Сохранённых поездок пока нет.';
  return 'Сохранённые поездки пользователя:\n' + state.trips.map(t => {
    const tot = budTotal(t);
    return '- ' + (t.id === state.activeTripId ? '[АКТИВНАЯ] ' : '') + (t.title || 'Без названия') + ' — ' + [t.city, t.country].filter(Boolean).join(', ') +
      '; даты: ' + fmtRange(t) + (tripDays(t) ? ' (' + tripDays(t) + ' дн.)' : '') + '; путешественников: ' + (t.travelers || 1) +
      '; бюджет: ' + (tot ? money(tot, t.currency) + ' (' + CATS.filter(c => +t.budget[c.k]).map(c => c.n.toLowerCase() + ' ' + money(t.budget[c.k], t.currency)).join(', ') + ')' : 'не задан') +
      (t.notes ? '; заметки: ' + t.notes.slice(0, 200) : '');
  }).join('\n');
}
function md(text){
  const lines = esc(text).split('\n'); let out = '', inList = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  for (const raw of lines){
    const l = raw.trim();
    const li = /^([-*•]|\d+[.)])\s+(.*)$/.exec(l);
    if (li){ if (!inList){ out += '<ul>'; inList = true; } out += '<li>' + inline(li[2]) + '</li>'; continue; }
    if (inList){ out += '</ul>'; inList = false; }
    if (!l) continue;
    const h = /^#{1,4}\s+(.*)$/.exec(l);
    out += h ? '<h4>' + inline(h[1]) + '</h4>' : '<p>' + inline(l) + '</p>';
  }
  if (inList) out += '</ul>';
  return out;
}
function msgHTML(x, i){
  if (x.role === 'user') return '<div class="msg user">' + esc(x.content) + '</div>';
  const inner = x.content ? md(x.content) : (x.error ? '' : '<span class="thinking"><i></i><i></i><i></i> Думаю…</span>');
  return '<div class="msg bot' + (x.error ? ' err' : '') + '" id="msg-' + i + '">' + inner + (x.error ? '<p>' + esc(x.error) + '</p>' : '') + '</div>';
}
function afterChat(){
  const box = $('#chat-input');
  if (box){ box.addEventListener('input', autoGrow); }
  const last = $('#msgs') && $('#msgs').lastElementChild;
  if (last && chat.length) last.scrollIntoView({block:'end'});
}
function autoGrow(){ const b = $('#chat-input'); if (!b) return; b.style.height = 'auto'; b.style.height = Math.min(180, b.scrollHeight) + 'px'; }
function errCopy(code){
  switch (code){
    case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
      aiState = 'off'; return 'AI-помощник недоступен в этом окне. Остальные разделы работают как обычно.';
    case 'rate_limited': return 'Слишком много запросов подряд. Подождите минуту и отправьте ещё раз.';
    case 'session_expired': return 'Сессия истекла — войдите в Claude заново и повторите вопрос.';
    case 'refused': return 'Помощник не может ответить на этот запрос. Попробуйте сформулировать по-другому.';
    case 'prompt_too_large': return 'Переписка стала слишком длинной. Очистите чат и начните заново.';
    case 'empty_completion': return 'Ответ получился пустым. Попробуйте уточнить вопрос.';
    default: return 'Связь прервалась. Отправьте сообщение ещё раз.';
  }
}
async function sendChat(text){
  text = (text || '').trim();
  if (!text || chatBusy || aiState !== 'ok' || !sampleFn) return;
  chat.push({role:'user', content:text});
  const idx = chat.push({role:'assistant', content:''}) - 1;
  chatBusy = true; chatCtl = new AbortController();
  go('ai');
  const hist = chat.slice(0, idx).filter(m => !m.error && m.content).slice(-20);
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const input = [{role:'user', content: RULES + '\n\nКонтекст (сегодня ' + fmtDate(new Date(), true) + '):\n' + tripsContext()}].concat(hist.map(m => ({role:m.role, content:m.content})));
  try {
    const r = await sampleFn(input, {cache:false, signal:chatCtl.signal, onText: ({text}) => {
      chat[idx].content = text; const el = document.getElementById('msg-' + idx); if (el){ el.innerHTML = md(text); }
    }});
    chat[idx].content = r.text;
    if (r.truncated) chat[idx].content += '\n\n*Ответ обрезан — попросите продолжить.*';
  } catch (e){
    const code = e && e.code;
    chat[idx].content = (e && e.text) || '';
    if (code !== 'cancelled') chat[idx].error = errCopy(code);
    else if (!chat[idx].content) chat[idx].error = 'Остановлено.';
    if (code === 'refused') chat[idx].content = '';
  } finally {
    chatBusy = false; chatCtl = null;
    if (route === 'ai') render();
  }
}
async function generateRoute(){
  const t = activeTrip(); if (!t || routeBusy || !sampleFn) return;
  const n = Math.min(tripDays(t) || 3, 14);
  routeBusy = true; routeErr = ''; render();
  const prompt = RULES + '\n\nСоставь маршрут поездки по дням.\nГород: ' + t.city + (t.country ? ', ' + t.country : '') + '\nДаты: ' + fmtRange(t) +
    '\nДней: ' + n + '\nПутешественников: ' + (t.travelers || 1) + (t.notes ? '\nЗаметки пользователя: ' + t.notes.slice(0, 400) : '') +
    '\n\nОтветь только JSON-массивом ровно из ' + n + ' объектов вида {"title": "короткий заголовок дня", "items": ["пункт", "пункт"]}. 3–5 конкретных пунктов на день, по-русски, без цен. Пример: [{"title":"Старый город","items":["Прогулка по набережной","Ужин в местном ресторане"]}]';
  try {
    const res = await sampleFn.json(prompt, {cache:false});
    const days = Array.isArray(res) ? res.filter(d => d && typeof d === 'object').map(d => ({title:String(d.title || '').slice(0, 120), items:(Array.isArray(d.items) ? d.items : []).map(x => String(x).slice(0, 200)).slice(0, 10)})) : [];
    if (!days.length) throw {code:'invalid_json'};
    const cur = state.trips.find(x => x.id === t.id);
    if (cur && !cur.itinerary.length){ cur.itinerary = days; save(); }
  } catch (e){
    routeErr = e && e.code === 'invalid_json' ? 'Не получилось разобрать ответ помощника. Попробуйте ещё раз.' : errCopy(e && e.code);
  } finally { routeBusy = false; if (route === 'route') render(); }
}

/* ================= модалка поездки ================= */
function openTrip(t){
  editing = t ? JSON.parse(JSON.stringify(t)) : blankTrip();
  editing._new = !t; delArmed = false;
  renderModal();
  const m = $('#modal'); m.hidden = false;
  setTimeout(() => { const f = $('#f-title'); if (f) f.focus(); }, 30);
}
function renderModal(){
  const t = editing;
  $('#modal').innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-h"><div class="row" style="justify-content:space-between"><h2 id="m-h">'+(t._new?'Новая поездка':'Поездка')+'</h2><button class="icon-btn" data-act="modal-close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
   '<div class="form">' +
    '<label class="field full"><span>Название</span><input class="input" id="f-title" data-f="title" value="'+esc(t.title)+'" placeholder="Например, Отпуск в Стамбуле"></label>' +
    '<label class="field"><span>Страна</span><input class="input" id="f-country" data-f="country" list="dl-countries" value="'+esc(t.country)+'" placeholder="Турция"></label>' +
    '<label class="field"><span>Город</span><input class="input" id="f-city" data-f="city" value="'+esc(t.city)+'" placeholder="Анталья"></label>' +
    '<div class="field full"><span>Значок</span><div class="emojis" role="group" aria-label="Значок поездки">'+EMOJIS.map(e => '<button type="button" class="'+(e===t.flag?'on':'')+'" data-act="f-emoji" data-e="'+e+'" aria-label="'+e+'">'+e+'</button>').join('')+'</div></div>' +
    '<label class="field"><span>Начало</span><input class="input" type="date" id="f-start" data-f="startDate" value="'+esc(t.startDate)+'"></label>' +
    '<label class="field"><span>Конец</span><input class="input" type="date" id="f-end" data-f="endDate" value="'+esc(t.endDate)+'"></label>' +
    '<label class="field"><span>Путешественников</span><input class="input" type="number" min="1" max="30" id="f-trav" data-f="travelers" value="'+esc(t.travelers)+'"></label>' +
    '<label class="field"><span>Валюта бюджета</span><select class="input" id="f-cur" data-f="currency">'+CURRENCIES.map(c => '<option'+(c===t.currency?' selected':'')+'>'+c+'</option>').join('')+'</select></label>' +
    '<label class="field full"><span>Заметки</span><textarea class="input" id="f-notes" data-f="notes" placeholder="Пожелания, идеи, важные детали">'+esc(t.notes)+'</textarea></label>' +
    '<p class="full" id="f-err" style="color:var(--coral);font-size:13.5px" hidden></p>' +
   '</div><datalist id="dl-countries">'+DESTINATIONS.map(d => '<option value="'+d.country+'">').join('')+'</datalist>' +
   '<div class="sheet-foot">'+(t._new?'<span></span>':'<button class="btn danger'+(delArmed?' armed':'')+'" data-act="modal-delete">'+(delArmed?'Точно удалить? Нажмите ещё раз':'Удалить поездку')+'</button>')+
   '<div class="row"><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn primary" data-act="modal-save">'+(t._new?'Создать':'Сохранить')+'</button></div></div></div>';
}
function closeModal(){ $('#modal').hidden = true; $('#modal').innerHTML = ''; editing = null; }
function saveModal(){
  const t = editing, err = $('#f-err');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!t.title.trim() && !t.city.trim()) return fail('Укажите название или город поездки.');
  if (t.startDate && t.endDate && parseD(t.endDate) < parseD(t.startDate)) return fail('Дата окончания раньше даты начала.');
  t.travelers = Math.max(1, Math.min(30, parseInt(t.travelers, 10) || 1));
  if (!t.title.trim()) t.title = t.city.trim();
  const isNew = t._new; delete t._new;
  if (isNew){ state.trips.push(t); state.activeTripId = t.id; }
  else { const i = state.trips.findIndex(x => x.id === t.id); if (i >= 0) state.trips[i] = t; }
  save(); closeModal(); render(); toast(isNew ? 'Поездка создана' : 'Изменения сохранены');
}

/* ================= toast ================= */
let toastT;
function toast(m){ const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200); }

/* ================= события ================= */
function closeMenu(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
document.addEventListener('click', e => {
  const hashA = e.target.closest('a[href^="#"]');
  if (hashA){ e.preventDefault(); closeMenu(); go(hashA.getAttribute('href').slice(1)); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, t = activeTrip();
  switch (act){
    case 'menu-open': $('#side').classList.add('open'); $('#scrim').classList.add('open'); break;
    case 'menu-close': closeMenu(); break;
    case 'theme': state.theme = {system:'light', light:'dark', dark:'system'}[state.theme]; applyTheme(); save(); renderNav(); break;
    case 'go': if (id){ state.activeTripId = id; save(); } go(el.dataset.to); break;
    case 'new-trip': openTrip(null); break;
    case 'edit-trip': openTrip(state.trips.find(x => x.id === id)); break;
    case 'open-trip': state.activeTripId = id; save(); openTrip(state.trips.find(x => x.id === id)); break;
    case 'set-active': state.activeTripId = id; save(); render(); toast('Поездка выбрана активной'); break;
    case 'modal-close': closeModal(); break;
    case 'modal-save': saveModal(); break;
    case 'modal-delete':
      if (!delArmed){ delArmed = true; renderModal(); break; }
      state.trips = state.trips.filter(x => x.id !== editing.id);
      if (state.activeTripId === editing.id) state.activeTripId = state.trips[0] ? state.trips[0].id : null;
      save(); closeModal(); render(); toast('Поездка удалена'); break;
    case 'f-emoji': editing.flag = el.dataset.e; document.querySelectorAll('.emojis button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'ask': sendChat(el.dataset.q); break;
    case 'chat-send': { const b = $('#chat-input'); sendChat(b && b.value); break; }
    case 'chat-stop': if (chatCtl) chatCtl.abort(); break;
    case 'chat-clear': chat = []; render(); break;
    case 'region': regionFilter = el.dataset.r; render(); break;
    case 'dest-trip': { const d = DESTINATIONS[+el.dataset.i]; openTrip(null); Object.assign(editing, {country:d.country, city:d.city, title:d.city, currency: CURRENCIES.includes(d.currency) ? d.currency : 'USD'}); renderModal(); break; }
    case 'dest-wx': wxIndex = +el.dataset.i; go('weather'); break;
    case 'wx-pick': wxIndex = +el.dataset.i; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'route-ai': generateRoute(); break;
    case 'day-add': if (t){ t.itinerary.push({title:'', items:[]}); save(); render(); const f = document.getElementById('day-title-' + (t.itinerary.length - 1)); if (f) f.focus(); } break;
    case 'day-del': if (t){ t.itinerary.splice(+el.dataset.i, 1); save(); render(); } break;
    case 'item-add': addItem(+el.dataset.i); break;
    case 'item-del': if (t){ t.itinerary[+el.dataset.i].items.splice(+el.dataset.j, 1); save(); render(); } break;
    case 'pack-tpl': if (t){ const have = new Set(t.packing.map(p => p.label.toLowerCase())); let n = 0;
        PACK_TPL[el.dataset.k].items.forEach(([cat, label]) => { if (!have.has(label.toLowerCase())){ t.packing.push({id:uid(), label, cat, done:false}); n++; } });
        save(); render(); toast(n ? 'Добавлено: ' + n : 'Все вещи из набора уже в списке'); } break;
    case 'pack-add': addPack(); break;
    case 'pack-del': if (t){ t.packing = t.packing.filter(p => p.id !== id); save(); render(); } break;
    case 'pack-clear': if (t){ t.packing = t.packing.filter(p => !p.done); save(); render(); } break;
  }
});
function addItem(i){
  const t = activeTrip(), inp = document.getElementById('item-in-' + i); if (!t || !inp) return;
  const v = inp.value.trim(); if (!v) return;
  t.itinerary[i].items.push(v); save(); render();
  const n = document.getElementById('item-in-' + i); if (n) n.focus();
}
function addPack(){
  const t = activeTrip(), inp = $('#pack-in'); if (!t || !inp) return;
  const v = inp.value.trim(); if (!v) return;
  if (t.packing.some(p => p.label.toLowerCase() === v.toLowerCase())){ toast('Такая вещь уже есть'); return; }
  const cat = $('#pack-cat').value;
  t.packing.push({id:uid(), label:v, cat, done:false}); save(); render();
  const n = $('#pack-in'); if (n) n.focus(); const c = $('#pack-cat'); if (c) c.value = cat;
}
document.addEventListener('input', e => {
  const el = e.target, t = activeTrip();
  if (el.id === 'profile-name'){ state.profile.name = el.value.slice(0, 40); save(); return; }
  if (el.dataset.f && editing){
    editing[el.dataset.f] = el.value;
    if (el.dataset.f === 'country'){ const d = DESTINATIONS.find(x => x.country.toLowerCase() === el.value.trim().toLowerCase()); const c = $('#f-city');
      if (d && c && !c.value.trim()){ c.value = d.city; editing.city = d.city; } }
    return;
  }
  if (el.dataset.bud && t){ const v = parseFloat(el.value.replace(/\s/g, '').replace(',', '.')); t.budget[el.dataset.bud] = isFinite(v) && v > 0 ? v : 0; save(); updateBudget(); return; }
  if (el.dataset.day != null && t){ t.itinerary[+el.dataset.day].title = el.value; save(); return; }
  if (el.dataset.s){ search[el.dataset.s] = el.value; const box = $('#links'); if (box){ const L = links();
      const grp = (title, arr) => '<section class="lgroup"><h3>'+title+'</h3>' + arr.map(l => '<a class="lnk" href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer"><span><b>'+l.n+'</b><small>'+esc(l.d)+'</small></span>'+ico('ext')+'</a>').join('') + '</section>';
      box.innerHTML = grp('Авиабилеты', L.fl) + grp('Жильё', L.st) + grp('Впечатления', L.ex); } return; }
});
document.addEventListener('change', e => {
  const el = e.target, t = activeTrip();
  if (el.id === 'trip-select'){ state.activeTripId = el.value; routeErr = ''; save(); render(); return; }
  if (el.id === 'bud-cur' && t){ t.currency = el.value; save(); render(); return; }
  if (el.dataset.pack && t){ const p = t.packing.find(x => x.id === el.dataset.pack); if (p){ p.done = el.checked; save(); render(); const n = document.getElementById('pk-' + p.id); if (n) n.focus(); } return; }
  if (el.dataset.f === 'currency' && editing){ editing.currency = el.value; }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape'){ if (editing) closeModal(); else closeMenu(); return; }
  if (e.key !== 'Enter') return;
  if (el.id === 'chat-input' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(el.value); return; }
  if (el.dataset.itemIn != null){ e.preventDefault(); addItem(+el.dataset.itemIn); return; }
  if (el.id === 'pack-in'){ e.preventDefault(); addPack(); return; }
  if (el.classList.contains('day-title')){ e.preventDefault(); const i = +el.dataset.day; const n = document.getElementById('item-in-' + i); if (n) n.focus(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ================= маршрутизация ================= */
function go(r){
  const prev = route;
  route = NAV.some(n => n[0] === r) ? r : 'overview';
  render();
  if (prev !== route) window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + route); } catch (e){}
}
function readRoute(){ const h = (location.hash || '').slice(1); route = NAV.some(n => n[0] === h) ? h : 'overview'; }
window.addEventListener('hashchange', () => { readRoute(); render(); window.scrollTo(0, 0); });

/* ================= старт ================= */
applyTheme(); readRoute(); render();

(async () => {
  if (!window.claude || typeof window.claude.use !== 'function'){ aiState = 'off'; render(); return; }
  try { sampleFn = await window.claude.use('sample'); } catch (e){ sampleFn = null; }
  aiState = sampleFn ? 'ok' : 'off';
  if (route === 'ai' || route === 'route') render();
})();
})();
</script>
